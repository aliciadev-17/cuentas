<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cuentas de los dos</title>
<meta name="theme-color" content="#FF6B4A" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C1424" media="(prefers-color-scheme: dark)">
<meta name="color-scheme" content="light dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Cuentas">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{
  --bg:#F3F4F7; --card:#FFFFFF; --ink:#12203B; --muted:#6B7690; --line:#E6E9F0; --soft:#F3F4F7;
  --coral:#FF6B4A; --orange:#FF9A3D; --blue:#2F6BFF; --sky:#38BDF8; --amber:#FFC53D; --navy:#12203B; --red:#E5383B;
  --hero1:#FF6B4A; --hero2:#FF8F55; --hero3:#FFA24A;
  --shadow:0 1px 2px rgba(18,32,59,.04),0 8px 24px rgba(18,32,59,.07);
  --nav-h:68px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C1424; --card:#16223A; --ink:#EEF2FA; --muted:#93A0BB; --line:#24324F; --soft:#1C2A46;
    --coral:#FF7E61; --blue:#5B8CFF; --red:#FF6B6B; --navy:#EEF2FA;
    --hero1:#C94A32; --hero2:#D5622F; --hero3:#DB7A2B;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
  }
}
:root[data-theme="dark"]{
  --bg:#0C1424; --card:#16223A; --ink:#EEF2FA; --muted:#93A0BB; --line:#24324F; --soft:#1C2A46;
  --coral:#FF7E61; --blue:#5B8CFF; --red:#FF6B6B; --navy:#EEF2FA;
  --hero1:#C94A32; --hero2:#D5622F; --hero3:#DB7A2B;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.28);
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{background:var(--bg)}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  -webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums;padding-bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 16px)}
#app{max-width:560px;margin:0 auto;min-height:100vh;position:relative}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none;padding:0}
input,select,textarea{font:inherit;color:var(--ink)}
h1,h2,h3{margin:0}
.muted{color:var(--muted)}
.small{font-size:13px}
.xs{font-size:11.5px}
.b{font-weight:700}
.row{display:flex;align-items:center;gap:10px}
.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.pad{padding:0 16px}
.stack>*+*{margin-top:12px}

/* ---------- cabecera ---------- */
.hero{background:linear-gradient(160deg,var(--hero1),var(--hero2) 60%,var(--hero3));color:#fff;padding:calc(env(safe-area-inset-top) + 14px) 0 56px;
  border-radius:0 0 28px 28px}
.hero .top{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:0 16px 12px}
.hello{font-size:13px;opacity:.9}
.hero h1{font-size:19px;font-weight:800;letter-spacing:-.01em;white-space:nowrap}
.month{display:flex;align-items:center;gap:2px;background:rgba(255,255,255,.2);border-radius:999px;padding:3px}
.month button{width:30px;height:30px;border-radius:50%;font-size:18px;color:inherit;line-height:1}
.month span{padding:0 4px;font-weight:700;font-size:13.5px;min-width:100px;text-align:center;white-space:nowrap}
.plain-head{padding:calc(env(safe-area-inset-top) + 14px) 16px 8px;display:flex;align-items:center;justify-content:space-between;gap:8px}
.plain-head h1{font-size:26px;font-weight:800;letter-spacing:-.02em}
.plain-head .month{background:var(--soft);color:var(--ink)}
.lock{display:inline-block;margin-left:4px}
.carousel{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scroll-padding:0 16px;padding:4px 16px 8px;scrollbar-width:none}
.carousel::-webkit-scrollbar{display:none}
.wcard{flex:0 0 172px;scroll-snap-align:start;background:var(--card);color:var(--ink);border-radius:20px;padding:14px;box-shadow:var(--shadow);text-align:left;position:relative}
.wcard.red{outline:2px solid var(--red)}
.wcard .chip{width:34px;height:34px;border-radius:11px;display:grid;place-items:center;font-size:17px;margin-bottom:10px}
.wcard .lbl{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.wcard .amt{font-size:23px;font-weight:800;letter-spacing:-.02em;margin-top:2px;white-space:nowrap}
.wcard .amt.neg{color:var(--red)}
.wcard .sub{font-size:12px;color:var(--muted);margin-top:2px;min-height:16px}
.tag{display:inline-block;font-size:11px;font-weight:700;border-radius:999px;padding:2px 8px;background:var(--soft);color:var(--muted)}
.tag.red{background:rgba(229,56,59,.14);color:var(--red)}
.tag.amber{background:rgba(255,197,61,.25);color:#8a5a00}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .tag.amber{color:#FFD470}}
.pull{margin-top:-40px;position:relative}

/* ---------- tarjetas ---------- */
.card{background:var(--card);border-radius:20px;padding:16px;box-shadow:var(--shadow)}
.card h2{font-size:15px;font-weight:800;letter-spacing:-.005em}
.card .head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.link{color:var(--coral);font-weight:700;font-size:13px}
.big{font-size:30px;font-weight:800;letter-spacing:-.03em}
.bar{height:10px;border-radius:99px;background:var(--soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;min-width:0}
.bars .r{display:grid;grid-template-columns:96px 1fr 84px;gap:8px;align-items:center;margin:9px 0;font-size:13px}
.bars .r b{text-align:right;font-weight:700}
.donut-wrap{position:relative;width:200px;height:200px;margin:0 auto}
.donut-wrap svg{width:100%;height:100%}
.donut-c{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:none}
.donut-c small{color:var(--muted);font-size:12px;font-weight:600}
.donut-c b{font-size:24px;font-weight:800;letter-spacing:-.02em}
.legend{display:grid;grid-template-columns:1fr 1fr;gap:6px 14px;margin-top:14px}
.legend div{display:flex;align-items:center;gap:7px;font-size:13px;min-width:0}
.legend i{width:10px;height:10px;border-radius:50%;flex:none}
.legend span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.legend b{margin-left:auto;font-weight:700}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.tile{border-radius:20px;padding:14px;color:#fff;text-align:left;min-height:96px;display:flex;flex-direction:column;justify-content:space-between}
.tile .t{font-size:12px;font-weight:700;opacity:.9}
.tile .v{font-size:22px;font-weight:800;letter-spacing:-.02em;white-space:nowrap}
.tile .s{font-size:12px;opacity:.92}
.t-blue{background:#2F6BFF}.t-coral{background:#FF6B4A}.t-navy{background:#12203B}.t-sky{background:#0E9AD7}.t-amber{background:#FFC53D;color:#12203B}.t-peach{background:#FFB4A2;color:#12203B}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .t-navy{background:#233358}}
:root[data-theme="dark"] .t-navy{background:#233358}

/* ---------- listas ---------- */
.list>*+*{border-top:1px solid var(--line)}
.item{display:flex;align-items:center;gap:12px;padding:11px 0;width:100%;text-align:left}
.ico{width:40px;height:40px;border-radius:13px;display:grid;place-items:center;font-size:19px;flex:none}
.item .t{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item .s{font-size:12.5px;color:var(--muted)}
.item .a{font-weight:700;white-space:nowrap;text-align:right}
.a.inc{color:var(--blue)}
.dayhead{font-size:12px;font-weight:700;color:var(--muted);padding:14px 4px 6px}.dayhead::first-letter{text-transform:uppercase}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 16px 10px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chipb{flex:none;border-radius:999px;padding:8px 14px;background:var(--card);box-shadow:var(--shadow);font-weight:600;font-size:14px;border:2px solid transparent}
.chipb.on{background:var(--navy);color:var(--card);}
.seg{display:flex;background:var(--soft);border-radius:14px;padding:4px;gap:2px}
.seg button{flex:1;padding:9px 4px;border-radius:11px;font-weight:700;font-size:14px;color:var(--muted)}
.seg button.on{background:var(--card);color:var(--ink);box-shadow:var(--shadow)}
.banner{border-radius:16px;padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.red{background:#FDE7E7;color:#B4232A}
.banner.info{background:#FFE9E2}
.banner.amber{background:#FFF1CC}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .banner.red{background:#3B2230;color:#FF9A9A}:root:not([data-theme="light"]) .banner.info{background:#3A2A2E}:root:not([data-theme="light"]) .banner.amber{background:#3A3322}}
.banner b{display:block}
.empty{text-align:center;padding:26px 12px;color:var(--muted)}
.empty .em{font-size:38px;margin-bottom:6px}
.empty b{display:block;color:var(--ink);font-size:16px;margin-bottom:4px}

/* ---------- botones y formularios ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:14px;padding:13px 18px;font-weight:800;background:var(--coral);color:#fff;width:100%}
.btn.sec{background:var(--soft);color:var(--ink)}
.btn.dark{background:var(--navy);color:var(--card)}
.btn.danger{background:rgba(229,56,59,.12);color:var(--red)}
.btn.sm{width:auto;padding:8px 14px;font-size:14px;border-radius:12px}
.btn:disabled{opacity:.45}
label.f{display:block;font-size:12.5px;font-weight:700;color:var(--muted);margin:14px 0 6px}
.in{width:100%;border:2px solid var(--line);background:var(--card);border-radius:14px;padding:12px 14px;outline:none}
.in:focus{border-color:var(--coral)}
.amount{font-size:40px;font-weight:800;text-align:center;border:0;background:none;width:100%;outline:none;letter-spacing:-.03em;padding:8px 0}
.amount::placeholder{color:var(--line)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.chgrid{display:flex;flex-wrap:wrap;gap:8px}
.pick{border-radius:14px;padding:10px 14px;background:var(--soft);font-weight:700;font-size:14px;border:2px solid transparent}
.pick.on{border-color:var(--coral);background:rgba(255,107,74,.13)}
.catgrid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.catb{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:14px;font-size:11.5px;font-weight:600;border:2px solid transparent;text-align:center}
.catb .ico{width:38px;height:38px;font-size:18px}
.catb.on{border-color:var(--coral);background:rgba(255,107,74,.1)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0}
.switch input{width:46px;height:28px;accent-color:var(--coral)}
hr.s{border:0;border-top:1px solid var(--line);margin:14px 0}
.kv{display:flex;justify-content:space-between;gap:12px;padding:6px 0;font-size:14px}
.kv b{font-weight:700}

/* ---------- navegación ---------- */
nav#nav{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--card);border-top:1px solid var(--line);
  padding-bottom:env(safe-area-inset-bottom)}
nav#nav .navinner{display:flex;max-width:560px;margin:0 auto;height:var(--nav-h);align-items:center}
nav#nav button{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:11px;font-weight:700;color:var(--muted);height:100%;justify-content:center}
nav#nav button svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
nav#nav button.on{color:var(--coral)}
nav#nav .plus{flex:0 0 76px}
nav#nav .plus span{width:54px;height:54px;border-radius:50%;background:var(--coral);color:#fff;display:grid;place-items:center;margin-top:-26px;box-shadow:0 8px 20px rgba(255,107,74,.45);font-size:30px;font-weight:400;line-height:1}

/* ---------- hojas modales ---------- */
.ov{position:fixed;inset:0;background:rgba(10,16,30,.5);z-index:50;display:flex;align-items:flex-end;justify-content:center;animation:fade .18s}
.sheet{background:var(--bg);width:100%;max-width:560px;max-height:92vh;overflow-y:auto;border-radius:26px 26px 0 0;padding:10px 16px calc(env(safe-area-inset-bottom) + 18px);animation:up .22s cubic-bezier(.2,.8,.2,1)}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.sheet h2{font-size:19px;font-weight:800;margin:2px 0 10px}
@keyframes up{from{transform:translateY(30px);opacity:0}to{transform:none;opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
#toast{position:fixed;left:50%;bottom:calc(var(--nav-h) + env(safe-area-inset-bottom) + 18px);transform:translateX(-50%) translateY(20px);background:var(--navy);color:var(--card);
  padding:11px 16px;border-radius:14px;font-weight:600;font-size:14px;z-index:80;opacity:0;pointer-events:none;transition:.25s;max-width:90vw;text-align:center}
#toast.show{opacity:1;transform:translateX(-50%)}
.login{max-width:420px;margin:0 auto;padding:calc(env(safe-area-inset-top) + 60px) 24px 24px}
.login .logo{width:72px;height:72px;border-radius:22px;background:linear-gradient(160deg,var(--hero1),var(--hero3));display:grid;place-items:center;font-size:36px;margin-bottom:18px}
.spin{width:28px;height:28px;border:3px solid var(--line);border-top-color:var(--coral);border-radius:50%;animation:rot .8s linear infinite;margin:80px auto}
@keyframes rot{to{transform:rotate(360deg)}}
details.d summary{cursor:pointer;font-weight:700;padding:8px 0;list-style:none}
details.d summary::-webkit-details-marker{display:none}
details.d summary:after{content:"›";float:right;transform:rotate(90deg);color:var(--muted)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
@media (min-width:700px){body{padding-top:12px}.hero{border-radius:28px}}
</style>
<script src="firebase-config.js"></script>
</head>
<body>
<div id="app">
  <div id="view"><div class="spin" aria-label="Cargando"></div></div>
</div>
<nav id="nav" hidden><div class="navinner" id="navin"></div></nav>
<div id="sheet-root"></div>
<div id="toast" role="status" aria-live="polite"></div>
<noscript><p style="padding:24px">Esta app necesita JavaScript.</p></noscript>
<script src="logic.js"></script>
<script src="store.js"></script>
<script src="app.js"></script>
</body>
</html>
